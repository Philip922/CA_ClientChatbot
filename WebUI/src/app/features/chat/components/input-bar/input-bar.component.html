<form class="composer" (submit)="$event.preventDefault(); submit()">
    <textarea
        #textarea
        class="composer__input"
        rows="1"
        [value]="value()"
        [disabled]="disabled()"
        [attr.placeholder]="placeholder()"
        [attr.aria-label]="placeholder()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"></textarea>

    @if (streaming()) {
    <button type="button" class="composer__send" aria-label="Stop generating" (click)="stop.emit()">
        <svg lucideSquare [size]="13" fill="currentColor" aria-hidden="true"></svg>
    </button>
    } @else {
    <button type="submit" class="composer__send" [disabled]="!canSend()" aria-label="Send message">
        <svg lucideArrowUp [size]="17" aria-hidden="true"></svg>
    </button>
    }
</form>
